name: Build APK

on:
  push:
    branches: [done]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Proyek ini belum punya gradle wrapper jar, jadi Gradle 8.7
      # (versi yang sama dengan gradle-wrapper.properties) dipasang
      # langsung dan perintah `gradle` yang dipakai, bukan ./gradlew.
      - name: Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Pasang Android SDK platform 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK debug
        run: gradle assembleDebug --stacktrace

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-webview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
